services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: callops-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: callops
      POSTGRES_PASSWORD: callops_dev
      POSTGRES_DB: callops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callops -d callops"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
