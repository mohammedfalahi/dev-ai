[project]
name = "dev-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammed Falahi", email = "sanufalahi5034@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
dev-ai = "dev_ai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
